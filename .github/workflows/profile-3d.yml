name: Update 3D contribution profile

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-3d
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate upstream 3D contribution SVG
        uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Keep selected upstream theme
        shell: bash
        run: |
          test -s profile-3d-contrib/profile-night-view.svg
          find profile-3d-contrib -type f ! -name 'profile-night-view.svg' -delete

      - name: Commit updated render
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- profile-3d-contrib)" ]; then
            echo "3D contribution profile is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-night-view.svg
          git commit -m "Update 3D contribution profile"
          git push
