<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">n3onnhowever - ML Developer and Data Engineer</title>
  <desc id="desc">An animated data pipeline connects ingest, model, and serve nodes beside a concise developer profile.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d18"/>
      <stop offset="0.55" stop-color="#10182a"/>
      <stop offset="1" stop-color="#151126"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.48" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="roseGlow">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="358" rx="24"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", Inter, Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
    .flow { stroke-dasharray: 10 14; animation: flow 7s linear infinite; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse-b { animation-delay: 0.8s; }
    .pulse-c { animation-delay: 1.6s; }
    .drift { animation: drift 8s ease-in-out infinite; }
    .drift-b { animation-delay: -3s; }
    .cursor { animation: blink 1.1s steps(2, start) infinite; }
    .scan { animation: scan 6.5s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -240; } }
    @keyframes pulse { 0%, 100% { opacity: 0.55; transform: scale(0.88); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { 0%, 12% { transform: translateX(0); opacity: 0; } 25%, 75% { opacity: 0.35; } 88%, 100% { transform: translateX(352px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .drift, .cursor, .scan { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#background)" stroke="#334155" stroke-opacity="0.7"/>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1010" cy="42" r="260" fill="url(#cyanGlow)"/>
    <circle cx="780" cy="350" r="240" fill="url(#roseGlow)"/>
    <path d="M0 317 C190 286 322 362 514 319 S866 266 1200 316" fill="none" stroke="url(#signal)" stroke-width="1.5" stroke-opacity="0.18"/>
    <circle class="drift" cx="1075" cy="72" r="3" fill="#38bdf8" opacity="0.8"/>
    <circle class="drift drift-b" cx="739" cy="71" r="2.5" fill="#f472b6" opacity="0.72"/>
    <circle class="drift" cx="1140" cy="276" r="2" fill="#34d399" opacity="0.75"/>
  </g>

  <g transform="translate(58 52)">
    <text class="mono" x="0" y="0" fill="#38bdf8" font-size="12" letter-spacing="2">PROFILE / SYSTEM ONLINE</text>
    <text class="sans" x="0" y="69" fill="#f8fafc" font-size="54" font-weight="700">n3onnhowever</text>
    <rect x="0" y="91" width="420" height="3" rx="1.5" fill="url(#signal)"/>
    <text class="mono" x="0" y="129" fill="#c4b5fd" font-size="19">ML DEVELOPER / DATA ENGINEER</text>
    <text class="sans" x="0" y="169" fill="#cbd5e1" font-size="16">I turn raw signals into dependable data products:</text>
    <text class="sans" x="0" y="195" fill="#94a3b8" font-size="16">pipelines, model services, interfaces, and the systems between them.</text>

    <g transform="translate(0 231)">
      <rect width="142" height="31" rx="15.5" fill="#0f2531" stroke="#22d3ee" stroke-opacity="0.45"/>
      <circle cx="18" cy="15.5" r="4" fill="#22d3ee"/>
      <text class="mono" x="31" y="20" fill="#bae6fd" font-size="11">DATA SYSTEMS</text>
      <rect x="153" width="132" height="31" rx="15.5" fill="#201936" stroke="#a78bfa" stroke-opacity="0.5"/>
      <circle cx="171" cy="15.5" r="4" fill="#a78bfa"/>
      <text class="mono" x="184" y="20" fill="#ddd6fe" font-size="11">APPLIED ML</text>
      <rect x="296" width="183" height="31" rx="15.5" fill="#2a1727" stroke="#f472b6" stroke-opacity="0.45"/>
      <circle cx="314" cy="15.5" r="4" fill="#f472b6"/>
      <text class="mono" x="327" y="20" fill="#fbcfe8" font-size="11">PRODUCT ENGINEERING</text>
    </g>
  </g>

  <g transform="translate(682 55)">
    <rect width="458" height="250" rx="19" fill="#070b13" fill-opacity="0.74" stroke="#475569" stroke-opacity="0.72"/>
    <circle cx="22" cy="20" r="4" fill="#fb7185"/>
    <circle cx="38" cy="20" r="4" fill="#fbbf24"/>
    <circle cx="54" cy="20" r="4" fill="#34d399"/>
    <text class="mono" x="76" y="24" fill="#64748b" font-size="10">pipeline.trace</text>
    <line x1="0" y1="40" x2="458" y2="40" stroke="#334155" stroke-opacity="0.75"/>

    <path class="flow" d="M74 130 H180 M278 130 H384" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)"/>

    <g transform="translate(22 89)">
      <rect width="94" height="82" rx="14" fill="#0b1c27" stroke="#38bdf8" stroke-opacity="0.64"/>
      <circle class="pulse" cx="47" cy="27" r="7" fill="#38bdf8" filter="url(#softGlow)"/>
      <text class="mono" x="47" y="55" text-anchor="middle" fill="#e0f2fe" font-size="11">INGEST</text>
      <text class="mono" x="47" y="69" text-anchor="middle" fill="#64748b" font-size="8">RAW SIGNALS</text>
    </g>
    <g transform="translate(182 89)">
      <rect width="94" height="82" rx="14" fill="#1a1530" stroke="#a78bfa" stroke-opacity="0.68"/>
      <circle class="pulse pulse-b" cx="47" cy="27" r="7" fill="#a78bfa" filter="url(#softGlow)"/>
      <text class="mono" x="47" y="55" text-anchor="middle" fill="#ede9fe" font-size="11">MODEL</text>
      <text class="mono" x="47" y="69" text-anchor="middle" fill="#64748b" font-size="8">STRUCTURE</text>
    </g>
    <g transform="translate(342 89)">
      <rect width="94" height="82" rx="14" fill="#281422" stroke="#f472b6" stroke-opacity="0.66"/>
      <circle class="pulse pulse-c" cx="47" cy="27" r="7" fill="#f472b6" filter="url(#softGlow)"/>
      <text class="mono" x="47" y="55" text-anchor="middle" fill="#fce7f3" font-size="11">SERVE</text>
      <text class="mono" x="47" y="69" text-anchor="middle" fill="#64748b" font-size="8">DECISIONS</text>
    </g>

    <g transform="translate(22 199)">
      <text class="mono" x="0" y="0" fill="#64748b" font-size="10">$ trace --from data --to product</text>
      <text class="mono" x="0" y="23" fill="#34d399" font-size="11">status: observable / reproducible / useful</text>
      <rect class="cursor" x="330" y="13" width="7" height="13" fill="#34d399"/>
    </g>
    <rect class="scan" x="52" y="52" width="1" height="126" fill="#38bdf8"/>
  </g>
</svg>
