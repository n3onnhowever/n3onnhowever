<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 176" role="img" aria-labelledby="title desc">
  <title id="title">Working technology stack</title>
  <desc id="desc">Python, TypeScript, SQL, FastAPI, React, Docker, machine learning, computer vision, and data operations.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.35" stop-color="#34d399"/>
      <stop offset="0.7" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", Inter, Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
    .rail { stroke-dasharray: 70 24; animation: rail 10s linear infinite; }
    @keyframes rail { to { stroke-dashoffset: -376; } }
    @media (prefers-reduced-motion: reduce) { .rail { animation: none; } }
  </style>

  <rect x="1" y="1" width="1198" height="174" rx="20" fill="url(#bg)" stroke="#334155" stroke-opacity="0.72"/>
  <text class="mono" x="34" y="39" fill="#94a3b8" font-size="11" letter-spacing="2">WORKING SET / FROM DATA TO DELIVERY</text>
  <line class="rail" x1="34" y1="56" x2="1166" y2="56" stroke="url(#rail)" stroke-width="2"/>

  <g class="sans" font-size="13" font-weight="600">
    <g transform="translate(34 78)"><rect width="104" height="38" rx="10" fill="#102238" stroke="#38bdf8" stroke-opacity="0.5"/><circle cx="18" cy="19" r="5" fill="#38bdf8"/><text x="32" y="24" fill="#e0f2fe">Python</text></g>
    <g transform="translate(148 78)"><rect width="126" height="38" rx="10" fill="#12213a" stroke="#60a5fa" stroke-opacity="0.5"/><circle cx="18" cy="19" r="5" fill="#60a5fa"/><text x="32" y="24" fill="#dbeafe">TypeScript</text></g>
    <g transform="translate(284 78)"><rect width="83" height="38" rx="10" fill="#132733" stroke="#2dd4bf" stroke-opacity="0.5"/><circle cx="18" cy="19" r="5" fill="#2dd4bf"/><text x="32" y="24" fill="#ccfbf1">SQL</text></g>
    <g transform="translate(377 78)"><rect width="102" height="38" rx="10" fill="#102b28" stroke="#34d399" stroke-opacity="0.5"/><circle cx="18" cy="19" r="5" fill="#34d399"/><text x="32" y="24" fill="#d1fae5">FastAPI</text></g>
    <g transform="translate(489 78)"><rect width="93" height="38" rx="10" fill="#17243a" stroke="#22d3ee" stroke-opacity="0.5"/><circle cx="18" cy="19" r="5" fill="#22d3ee"/><text x="32" y="24" fill="#cffafe">React</text></g>
    <g transform="translate(592 78)"><rect width="101" height="38" rx="10" fill="#182239" stroke="#818cf8" stroke-opacity="0.5"/><circle cx="18" cy="19" r="5" fill="#818cf8"/><text x="32" y="24" fill="#e0e7ff">Docker</text></g>
    <g transform="translate(703 78)"><rect width="92" height="38" rx="10" fill="#211b38" stroke="#a78bfa" stroke-opacity="0.5"/><circle cx="18" cy="19" r="5" fill="#a78bfa"/><text x="32" y="24" fill="#ede9fe">ML / CV</text></g>
    <g transform="translate(805 78)"><rect width="118" height="38" rx="10" fill="#29182f" stroke="#e879f9" stroke-opacity="0.46"/><circle cx="18" cy="19" r="5" fill="#e879f9"/><text x="32" y="24" fill="#fae8ff">LLM systems</text></g>
    <g transform="translate(933 78)"><rect width="145" height="38" rx="10" fill="#2a1727" stroke="#f472b6" stroke-opacity="0.5"/><circle cx="18" cy="19" r="5" fill="#f472b6"/><text x="32" y="24" fill="#fce7f3">Data operations</text></g>
  </g>

  <text class="mono" x="34" y="148" fill="#64748b" font-size="10">MODEL SERVICES</text>
  <text class="mono" x="200" y="148" fill="#64748b" font-size="10">FORECASTING</text>
  <text class="mono" x="348" y="148" fill="#64748b" font-size="10">OCR / NLP</text>
  <text class="mono" x="480" y="148" fill="#64748b" font-size="10">AUDIT TOOLING</text>
  <text class="mono" x="642" y="148" fill="#64748b" font-size="10">FULL-STACK DELIVERY</text>
  <text class="mono" x="860" y="148" fill="#64748b" font-size="10">REPRODUCIBLE WORKFLOWS</text>
</svg>
